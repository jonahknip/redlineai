<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redline.AI | QA/QC Plan Review</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1B365D">
    <meta name="description" content="AI-Powered QA/QC Plan Review Agent for Civil Engineering">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Redline.AI">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/static/manifest.json">
    
    <!-- Icons -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='none' stroke='%231B365D' stroke-width='4'/><rect x='22' y='25' width='22' height='22' fill='%23C8102E'/><rect x='22' y='50' width='22' height='22' fill='%23C8102E'/><rect x='47' y='25' width='30' height='22' fill='%23C8102E'/><rect x='47' y='50' width='16' height='22' fill='%23C8102E'/></svg>">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
    
    <!-- PDF.js for preview -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #030014;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* Background */
        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(200, 16, 46, 0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(27, 54, 93, 0.15) 0%, transparent 50%);
            z-index: 0;
            pointer-events: none;
        }

        /* App Container */
        .app-container {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .app-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: rgba(27, 54, 93, 0.4);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #C8102E;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .project-info {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .install-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .install-btn:hover {
            background: rgba(255,255,255,0.15);
        }

        .install-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* Upload View */
        .upload-view {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .upload-view.hidden {
            display: none;
        }

        .upload-container {
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .upload-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .upload-subtitle {
            color: rgba(255,255,255,0.5);
            margin-bottom: 40px;
        }

        .upload-zone {
            background: rgba(255,255,255,0.03);
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 60px 40px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 24px;
        }

        .upload-zone:hover {
            border-color: #C8102E;
            background: rgba(200, 16, 46, 0.05);
        }

        .upload-zone.has-file {
            border-color: #28a745;
            background: rgba(40, 167, 69, 0.05);
        }

        .upload-zone.dragover {
            border-color: #C8102E;
            background: rgba(200, 16, 46, 0.1);
            transform: scale(1.02);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            color: rgba(255,255,255,0.4);
        }

        .upload-zone.has-file .upload-icon {
            color: #28a745;
        }

        .upload-text {
            color: rgba(255,255,255,0.7);
            font-size: 1.1rem;
        }

        .file-name {
            color: #28a745;
            font-weight: 600;
            margin-top: 12px;
            font-size: 0.95rem;
        }

        .pdf-preview {
            margin-top: 16px;
            max-height: 150px;
            border-radius: 8px;
            overflow: hidden;
        }

        .pdf-preview canvas {
            max-width: 100%;
            max-height: 150px;
            border-radius: 8px;
        }

        /* Review Type Selector */
        .review-selector {
            display: none;
            margin-top: 24px;
        }

        .review-selector.visible {
            display: block;
        }

        .review-selector h3 {
            font-size: 1rem;
            color: rgba(255,255,255,0.7);
            margin-bottom: 16px;
        }

        .review-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .review-option {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .review-option:hover {
            border-color: rgba(200, 16, 46, 0.5);
            background: rgba(200, 16, 46, 0.05);
        }

        .review-option.selected {
            border-color: #C8102E;
            background: rgba(200, 16, 46, 0.1);
        }

        .review-option-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .review-option-desc {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
        }

        .start-review-btn {
            background: linear-gradient(135deg, #C8102E 0%, #a00d25 100%);
            border: none;
            color: #fff;
            padding: 16px 48px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            opacity: 0.5;
            pointer-events: none;
        }

        .start-review-btn.enabled {
            opacity: 1;
            pointer-events: auto;
        }

        .start-review-btn.enabled:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(200, 16, 46, 0.4);
        }

        /* Split View */
        .split-view {
            flex: 1;
            display: none;
            overflow: hidden;
        }

        .split-view.active {
            display: flex;
        }

        /* Chat Panel */
        .chat-panel {
            width: 380px;
            min-width: 320px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255,255,255,0.08);
            background: rgba(0,0,0,0.2);
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .panel-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .status-indicator {
            font-size: 0.8rem;
            color: #ffc107;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-indicator.complete {
            color: #28a745;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            animation: pulse-dot 1.5s infinite;
        }

        .status-indicator.complete .status-dot {
            animation: none;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 90%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .message.ai {
            background: rgba(27, 54, 93, 0.4);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.user {
            background: rgba(200, 16, 46, 0.3);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .chat-input-area {
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            min-height: 46px;
            max-height: 120px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #C8102E;
        }

        .chat-input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .chat-send-btn {
            background: #C8102E;
            border: none;
            color: #fff;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }

        .chat-send-btn:hover {
            background: #a00d25;
        }

        .chat-send-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Report Panel */
        .report-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: rgba(255,255,255,0.02);
        }

        .report-header {
            padding: 16px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .report-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .export-btn {
            background: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .export-btn:hover:not(:disabled) {
            background: rgba(40, 167, 69, 0.3);
        }

        .export-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .export-btn svg {
            width: 16px;
            height: 16px;
        }

        .report-content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Progress Section */
        .progress-section {
            margin-bottom: 24px;
        }

        .progress-bar-container {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #C8102E, #28a745);
            border-radius: 8px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .progress-text {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.6);
            display: flex;
            justify-content: space-between;
        }

        /* Section Cards */
        .section-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            margin-bottom: 16px;
            overflow: hidden;
        }

        .section-header {
            padding: 16px 20px;
            background: rgba(27, 54, 93, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .section-title {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .section-status {
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-status.loading {
            color: #ffc107;
        }

        .section-status.complete {
            color: #28a745;
        }

        .section-status.pending {
            color: rgba(255,255,255,0.4);
        }

        .section-body {
            padding: 16px 20px;
            display: none;
        }

        .section-card.expanded .section-body {
            display: block;
        }

        /* Checklist Items */
        .checklist-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .checklist-table th {
            text-align: left;
            padding: 10px 12px;
            background: rgba(255,255,255,0.05);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.6);
        }

        .checklist-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: top;
        }

        .checklist-table tr:last-child td {
            border-bottom: none;
        }

        /* Status Badges */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-pass { background: #28a745; color: #fff; }
        .badge-fail { background: #dc3545; color: #fff; }
        .badge-review { background: #ffc107; color: #000; }
        .badge-skipped { background: #fd7e14; color: #fff; }
        .badge-na { background: #6c757d; color: #fff; }

        /* Page refs */
        .page-ref {
            display: inline-block;
            padding: 2px 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            font-size: 0.7rem;
            margin-right: 4px;
            font-family: monospace;
        }

        /* Summary Box */
        .summary-section {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .summary-box {
            flex: 1;
            min-width: 80px;
            padding: 16px;
            border-radius: 12px;
            text-align: center;
        }

        .summary-box.pass { background: rgba(40, 167, 69, 0.15); border: 1px solid rgba(40, 167, 69, 0.3); }
        .summary-box.fail { background: rgba(220, 53, 69, 0.15); border: 1px solid rgba(220, 53, 69, 0.3); }
        .summary-box.review { background: rgba(255, 193, 7, 0.15); border: 1px solid rgba(255, 193, 7, 0.3); }
        .summary-box.skipped { background: rgba(253, 126, 20, 0.15); border: 1px solid rgba(253, 126, 20, 0.3); }
        .summary-box.na { background: rgba(108, 117, 125, 0.15); border: 1px solid rgba(108, 117, 125, 0.3); }

        .summary-count {
            font-size: 1.8rem;
            font-weight: 700;
            display: block;
        }

        .summary-box.pass .summary-count { color: #28a745; }
        .summary-box.fail .summary-count { color: #dc3545; }
        .summary-box.review .summary-count { color: #ffc107; }
        .summary-box.skipped .summary-count { color: #fd7e14; }
        .summary-box.na .summary-count { color: #6c757d; }

        .summary-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.6);
        }

        /* Measurement Questions */
        .measurement-question {
            margin-top: 12px;
            padding: 12px;
            background: rgba(255, 193, 7, 0.1);
            border-radius: 8px;
            border-left: 3px solid #ffc107;
        }

        .measurement-question label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.9);
        }

        .measurement-input {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.85rem;
            width: 150px;
            margin-right: 10px;
        }

        .measurement-input:focus {
            outline: none;
            border-color: #ffc107;
        }

        .threshold-hint {
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
            margin-top: 6px;
        }

        .skip-checkbox {
            margin-left: 16px;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
        }

        .skip-checkbox input {
            margin-right: 6px;
        }

        .submit-answers-btn {
            margin-top: 24px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #ffc107 0%, #e0a800 100%);
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .submit-answers-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }

        /* Hidden file input */
        #fileInput {
            display: none;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Spinner */
        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Loading skeleton */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>
    
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                REDLINE<span>.AI</span>
            </div>
            <div class="header-actions">
                <span class="project-info" id="projectInfo"></span>
                <button class="install-btn" id="installBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Install
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Upload View -->
            <div class="upload-view" id="uploadView">
                <div class="upload-container">
                    <h1 class="upload-title">QA/QC Plan Review</h1>
                    <p class="upload-subtitle">Upload a planset and select your review type</p>
                    
                    <div class="upload-zone" id="uploadZone">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <p class="upload-text">Click to upload or drag & drop</p>
                        <p class="file-name" id="fileName"></p>
                        <div class="pdf-preview" id="pdfPreview"></div>
                    </div>
                    <input type="file" id="fileInput" accept=".pdf">

                    <div class="review-selector" id="reviewSelector">
                        <h3>Select Review Type</h3>
                        <div class="review-options">
                            <div class="review-option" data-review="30_percent">
                                <div class="review-option-title">30% Review</div>
                                <div class="review-option-desc">Early design validation</div>
                            </div>
                            <div class="review-option" data-review="60_percent">
                                <div class="review-option-title">60% Review</div>
                                <div class="review-option-desc">Design development</div>
                            </div>
                            <div class="review-option" data-review="90_percent">
                                <div class="review-option-title">90% Review</div>
                                <div class="review-option-desc">Final QC before bid</div>
                            </div>
                            <div class="review-option" data-review="full_review">
                                <div class="review-option-title">Full Review</div>
                                <div class="review-option-desc">All 146 checklist items</div>
                            </div>
                        </div>
                        <button class="start-review-btn" id="startReviewBtn">Start Review</button>
                    </div>
                </div>
            </div>

            <!-- Split View (hidden until review starts) -->
            <div class="split-view" id="splitView">
                <!-- Chat Panel -->
                <div class="chat-panel">
                    <div class="panel-header">
                        <h2>Chat</h2>
                        <span class="status-indicator" id="statusIndicator">
                            <span class="status-dot"></span>
                            <span id="statusText">Analyzing...</span>
                        </span>
                    </div>
                    <div class="chat-messages" id="chatMessages">
                        <!-- Messages will be added here -->
                    </div>
                    <div class="chat-input-area">
                        <textarea class="chat-input" id="chatInput" placeholder="Ask questions or provide instructions..." rows="1"></textarea>
                        <button class="chat-send-btn" id="chatSendBtn">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"/>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Report Panel -->
                <div class="report-panel">
                    <div class="report-header">
                        <h2>QA/QC Report</h2>
                        <button class="export-btn" id="exportBtn" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <line x1="12" y1="18" x2="12" y2="12"/>
                                <polyline points="9 15 12 12 15 15"/>
                            </svg>
                            Export PDF
                        </button>
                    </div>
                    <div class="report-content" id="reportContent">
                        <!-- Report will be populated here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // STATE
        // ============================================
        let uploadedFile = null;
        let selectedReviewType = null;
        let currentReviewId = null;
        let currentProjectName = '';
        let currentEvalData = null;
        let reviewInProgress = false;
        let eventSource = null;

        // Review type labels
        const reviewLabels = {
            '30_percent': '30% Engineering Review',
            '60_percent': '60% Engineering Review',
            '90_percent': '90% Engineering Review',
            'full_review': 'Full Engineering Review'
        };

        // ============================================
        // DOM ELEMENTS
        // ============================================
        const uploadView = document.getElementById('uploadView');
        const splitView = document.getElementById('splitView');
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const pdfPreview = document.getElementById('pdfPreview');
        const reviewSelector = document.getElementById('reviewSelector');
        const reviewOptions = document.querySelectorAll('.review-option');
        const startReviewBtn = document.getElementById('startReviewBtn');
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const chatSendBtn = document.getElementById('chatSendBtn');
        const reportContent = document.getElementById('reportContent');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const exportBtn = document.getElementById('exportBtn');
        const projectInfo = document.getElementById('projectInfo');

        // ============================================
        // FILE UPLOAD
        // ============================================
        uploadZone.addEventListener('click', () => fileInput.click());
        
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type === 'application/pdf') {
                handleFileUpload(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFileUpload(file);
            }
        });

        async function handleFileUpload(file) {
            uploadedFile = file;
            fileName.textContent = file.name;
            uploadZone.classList.add('has-file');
            
            // Show PDF preview
            await renderPdfPreview(file);
            
            // Show review type selector
            reviewSelector.classList.add('visible');
        }

        async function renderPdfPreview(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const page = await pdf.getPage(1);
                
                const scale = 1.0;
                const viewport = page.getViewport({ scale });
                
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                const context = canvas.getContext('2d');
                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;
                
                pdfPreview.innerHTML = '';
                pdfPreview.appendChild(canvas);
            } catch (error) {
                console.error('PDF preview error:', error);
            }
        }

        // ============================================
        // REVIEW TYPE SELECTION
        // ============================================
        reviewOptions.forEach(option => {
            option.addEventListener('click', () => {
                reviewOptions.forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
                selectedReviewType = option.dataset.review;
                startReviewBtn.classList.add('enabled');
            });
        });

        startReviewBtn.addEventListener('click', () => {
            if (uploadedFile && selectedReviewType) {
                startReview();
            }
        });

        // ============================================
        // START REVIEW
        // ============================================
        async function startReview() {
            reviewInProgress = true;
            
            // Switch to split view
            uploadView.classList.add('hidden');
            splitView.classList.add('active');
            
            // Add initial AI message
            addChatMessage('ai', `Working on your ${reviewLabels[selectedReviewType]}. Is there anything specific we should check for today?`);
            
            // Initialize report with loading state
            reportContent.innerHTML = `
                <div class="progress-section">
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div class="progress-text">
                        <span id="progressLabel">Analyzing planset...</span>
                        <span id="progressPercent">0%</span>
                    </div>
                </div>
                <div class="summary-section" id="summarySection" style="display: none;">
                    <div class="summary-box pass"><span class="summary-count" id="passCount">0</span><span class="summary-label">Pass</span></div>
                    <div class="summary-box fail"><span class="summary-count" id="failCount">0</span><span class="summary-label">Fail</span></div>
                    <div class="summary-box review"><span class="summary-count" id="reviewCount">0</span><span class="summary-label">Review</span></div>
                    <div class="summary-box na"><span class="summary-count" id="naCount">0</span><span class="summary-label">N/A</span></div>
                </div>
                <div id="sectionsContainer"></div>
            `;
            
            // Upload file and start review
            const formData = new FormData();
            formData.append('planset', uploadedFile);
            formData.append('checklist_id', selectedReviewType);
            
            try {
                const response = await fetch('/api/review', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    currentReviewId = data.review_id;
                    currentProjectName = data.project_name || 'Plan Review';
                    currentEvalData = data.eval_data || {};
                    
                    projectInfo.textContent = currentProjectName;
                    
                    // Update progress to 100%
                    document.getElementById('progressBar').style.width = '100%';
                    document.getElementById('progressPercent').textContent = '100%';
                    document.getElementById('progressLabel').textContent = 'Review complete!';
                    
                    // Mark as complete
                    statusIndicator.classList.add('complete');
                    statusText.textContent = 'Complete';
                    reviewInProgress = false;
                    
                    // Enable export
                    exportBtn.disabled = false;
                    
                    // Render full report
                    renderReport(data);
                    
                    // Add completion message
                    addChatMessage('ai', `Review complete! I analyzed ${data.page_count} pages and found ${countStatus('FAIL')} issues and ${countStatus('REVIEW')} items needing verification. You can ask me questions about the findings or export the report.`);
                } else {
                    addChatMessage('ai', `Sorry, there was an error: ${data.error}`);
                    statusText.textContent = 'Error';
                }
            } catch (error) {
                addChatMessage('ai', `Network error: ${error.message}`);
                statusText.textContent = 'Error';
            }
        }

        function countStatus(status) {
            if (!currentEvalData) return 0;
            return Object.values(currentEvalData).filter(item => item.status === status).length;
        }

        // ============================================
        // RENDER REPORT
        // ============================================
        function renderReport(data) {
            const sectionsContainer = document.getElementById('sectionsContainer');
            const summarySection = document.getElementById('summarySection');
            
            // Show and update summary
            summarySection.style.display = 'flex';
            document.getElementById('passCount').textContent = countStatus('PASS');
            document.getElementById('failCount').textContent = countStatus('FAIL');
            document.getElementById('reviewCount').textContent = countStatus('REVIEW');
            document.getElementById('naCount').textContent = countStatus('N/A');
            
            // Group items by section
            const sections = {};
            Object.entries(currentEvalData).forEach(([id, item]) => {
                const section = item.section || 'General';
                if (!sections[section]) sections[section] = [];
                sections[section].push({ id, ...item });
            });
            
            // Render sections
            sectionsContainer.innerHTML = '';
            Object.entries(sections).forEach(([sectionName, items]) => {
                const sectionHtml = `
                    <div class="section-card expanded">
                        <div class="section-header" onclick="this.parentElement.classList.toggle('expanded')">
                            <span class="section-title">${sectionName}</span>
                            <span class="section-status complete">${items.length} items</span>
                        </div>
                        <div class="section-body">
                            <table class="checklist-table">
                                <thead>
                                    <tr>
                                        <th style="width: 70px;">Status</th>
                                        <th style="width: 60px;">Page</th>
                                        <th style="width: 100px;">ID</th>
                                        <th>Item</th>
                                        <th>Comments</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${items.map(item => renderChecklistRow(item)).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                sectionsContainer.innerHTML += sectionHtml;
            });
        }

        function renderChecklistRow(item) {
            const statusClass = `badge-${item.status.toLowerCase().replace('/', '')}`;
            const pageRefs = item.page_refs && item.page_refs.length > 0 
                ? item.page_refs.map(p => `<span class="page-ref">${p}</span>`).join('') 
                : '-';
            
            return `
                <tr>
                    <td><span class="badge ${statusClass}">${item.status}</span></td>
                    <td>${pageRefs}</td>
                    <td style="font-family: monospace; font-size: 0.8rem; color: rgba(255,255,255,0.6);">${item.id}</td>
                    <td>${item.text || ''}</td>
                    <td>${item.comment || ''}</td>
                </tr>
            `;
        }

        // ============================================
        // CHAT FUNCTIONALITY
        // ============================================
        function addChatMessage(type, content) {
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.innerHTML = content;
            chatMessages.appendChild(msg);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatSendBtn.addEventListener('click', sendChatMessage);
        
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendChatMessage();
            }
        });

        // Auto-resize textarea
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
        });

        async function sendChatMessage() {
            const query = chatInput.value.trim();
            if (!query) return;
            
            // Clear input
            chatInput.value = '';
            chatInput.style.height = 'auto';
            
            // Add user message
            addChatMessage('user', escapeHtml(query));
            
            // If review hasn't started yet, just acknowledge
            if (!currentReviewId) {
                addChatMessage('ai', "I'll keep that in mind for the review. The analysis will begin once you select a review type and click Start Review.");
                return;
            }
            
            // Add typing indicator
            const typingId = 'typing-' + Date.now();
            addChatMessage('ai', `<span id="${typingId}">Thinking...</span>`);
            
            try {
                const response = await fetch(`/api/review/${currentReviewId}/followup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });
                
                const data = await response.json();
                
                // Remove typing indicator
                const typingEl = document.getElementById(typingId);
                if (typingEl) typingEl.parentElement.remove();
                
                if (data.success) {
                    addChatMessage('ai', escapeHtml(data.response).replace(/\n/g, '<br>'));
                    
                    // Update eval data if there were changes
                    if (data.eval_updates && Object.keys(data.eval_updates).length > 0) {
                        Object.assign(currentEvalData, data.eval_updates);
                        // Re-render report with updates
                        renderReport({ eval_data: currentEvalData });
                    }
                } else {
                    addChatMessage('ai', `Sorry, there was an error: ${data.error}`);
                }
            } catch (error) {
                const typingEl = document.getElementById(typingId);
                if (typingEl) typingEl.parentElement.remove();
                addChatMessage('ai', `Network error: ${error.message}`);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================
        // EXPORT
        // ============================================
        exportBtn.addEventListener('click', exportPdf);

        async function exportPdf() {
            if (!currentReviewId) return;
            
            exportBtn.disabled = true;
            exportBtn.innerHTML = '<span class="spinner">⏳</span> Generating...';
            
            try {
                const formData = new FormData();
                formData.append('planset', uploadedFile);
                formData.append('review_id', currentReviewId);
                
                const response = await fetch('/api/export/pdf-with-pages', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${currentProjectName.replace(/[^a-zA-Z0-9\s-_]/g, '_')}_QA_QC_Report.pdf`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();
                } else {
                    alert('Export failed. Please try again.');
                }
            } catch (error) {
                alert('Export error: ' + error.message);
            } finally {
                exportBtn.disabled = false;
                exportBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="12" y1="18" x2="12" y2="12"/>
                        <polyline points="9 15 12 12 15 15"/>
                    </svg>
                    Export PDF
                `;
            }
        }

        // ============================================
        // PWA INSTALL
        // ============================================
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'flex';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Check if already installed
        if (window.matchMedia('(display-mode: standalone)').matches) {
            installBtn.style.display = 'none';
        }

        // Register service worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/service-worker.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW registration failed:', err));
        }

        // ============================================
        // URL PARAMS (for PWA shortcuts)
        // ============================================
        function handleUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const reviewType = urlParams.get('review');
            
            if (reviewType && ['30_percent', '60_percent', '90_percent', 'full_review'].includes(reviewType)) {
                // Pre-select review type when file is uploaded
                window.preselectedReviewType = reviewType;
                
                // Auto-open file picker
                setTimeout(() => {
                    fileInput.click();
                }, 300);
                
                // Clean URL
                window.history.replaceState({}, '', '/');
            }
        }

        // Handle preselected review type after file upload
        const originalHandleFileUpload = handleFileUpload;
        handleFileUpload = async function(file) {
            await originalHandleFileUpload(file);
            
            if (window.preselectedReviewType) {
                const option = document.querySelector(`[data-review="${window.preselectedReviewType}"]`);
                if (option) {
                    option.click();
                }
                window.preselectedReviewType = null;
            }
        };

        handleUrlParams();
    </script>
</body>
</html>
